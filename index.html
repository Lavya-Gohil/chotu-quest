<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chotu's Secret Treasure 🍓</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#5b1730;background:#fff4f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#ffd7df,transparent 35%),radial-gradient(circle at 90% 85%,#ffe5cd,transparent 35%),#fff5f2}.card{width:min(100%,520px);background:#fffdfb;border:2px solid #ffd0d9;border-radius:28px;padding:28px;box-shadow:0 18px 60px #a3214520;text-align:center}.eyebrow{font-size:12px;letter-spacing:2px;color:#ad4b68;font-weight:800}.strawberry{font-size:44px}h1{font-family:Georgia,serif;font-size:clamp(28px,7vw,42px);line-height:1.12;margin:12px 0;color:#8d173c}p{line-height:1.6}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;background:#b51e4d;color:white;font-weight:750;width:100%;margin-top:10px}button:hover{background:#90153b}.choice{background:#fff0f2;color:#7c1838;border:1px solid #f2b5c6;text-align:left}.choice:hover{background:#ffdae4}.progress{height:9px;background:#f9dce4;border-radius:20px;overflow:hidden;margin:20px 0}.bar{height:100%;background:#c32656;transition:width .3s}.note{background:#fff2e8;border:1px dashed #db8d9c;border-radius:14px;padding:15px;margin:16px 0}.small{font-size:13px;color:#9a6678}.hidden{display:none}input{width:100%;padding:13px;border:1px solid #e6a8b8;border-radius:12px;font:inherit}.heart{color:#d5295b}#feedback{min-height:26px;font-weight:700} .confetti{font-size:32px;letter-spacing:6px}</style><main class="card"><div class="eyebrow">A ONE-MONTH ANNIVERSARY ADVENTURE</div><div class="strawberry">🍓</div><div class="progress"><div id="bar" class="bar" style="width:0%"></div></div><div id="app"></div></main><script>
// CUSTOMIZE THESE HIDING SPOTS BEFORE SHARING THE GAME.
// Place paper clues under pillow, near mirror, in closet, and near makeup mirror.
// Hide the earrings in a protective pouch INSIDE THE DRAWER.
const steps=[
{q:'When did we officially become gifiend & boifiend? 💌',a:['13 October 2026','14 February 2026','13 November 2026'],correct:0,after:'The day my favourite story began. ❤️'},
{q:'On our pasta date, what colours did we wear? 🍝',a:['You in red, me in blue','Me in red, you in blue','Both in black'],correct:1,after:'And you picked my shirt. I still think about that night.'},
{q:'What did you mention wanting just once, and I remembered? 🎀',a:['A Coach bag','A teddy bear','A necklace'],correct:0,after:'Your little wishes matter to me, Chotu.'},
{q:'What is your boifiend’s favourite place? 🥹',a:['A fancy restaurant','Anywhere with Chotu','The moon'],correct:1,after:'Even doing nothing feels special with you.'}
];const stops=[
 {name:'UNDER THE PILLOW',emoji:'💤',riddle:'Where dreams begin and sleepy heads rest, look underneath to start your quest.',code:'1310',next:'Near your regular mirror'},
 {name:'NEAR THE MIRROR',emoji:'🪞',riddle:'Find the glass that shows the face I adore. A secret waits nearby, and then there is more.',code:'BLUE',next:'Inside the closet'},
 {name:'INSIDE THE CLOSET',emoji:'👗',riddle:'Where your outfits wait in a neat little row, a hidden message is waiting to show.',code:'PASTA',next:'Near the makeup mirror'},
 {name:'NEAR THE MAKEUP MIRROR',emoji:'💄',riddle:'Where you get ready and your sparkle shines, your final little secret is waiting to be mine.',code:'CHOTU',next:'Inside the drawer'},
];
let stage=-1,wrong=0;const app=document.getElementById('app'),bar=document.getElementById('bar');
function progress(n){bar.style.width=Math.max(0,Math.min(100,n))+'%'}
function showIntro(){progress(0);app.innerHTML=`<h1>Chotu's Secret Treasure ♡</h1><p>BABYYYY 😭❤️ Your boifiend has hidden a tiny surprise somewhere in your room.</p><div class="note">Four memories. Four hidden secret codes. One last treasure. No skipping, princess! 🍓</div><button onclick="next()">Start my quest 🍓</button><p class="small">Made with all my love, for my favourite girl.</p>`}
function next(){stage++;wrong=0;render()}
function render(){progress(stage/(steps.length+stops.length+1)*100);
if(stage<steps.length){const s=steps[stage];app.innerHTML=`<p class="small">MEMORY ${stage+1} OF ${steps.length}</p><h1>${s.q}</h1>${s.a.map((a,i)=>`<button class="choice" onclick="answer(${i})">${a}</button>`).join('')}<p id="feedback" aria-live="polite"></p>`;return}
let k=stage-steps.length;
if(k<stops.length){let s=stops[k];app.innerHTML=`<p class="small">SECRET LOCATION ${k+1} / 4</p><h1>${s.emoji} ${s.name}</h1><div class="note">${s.riddle}</div><p>Find the paper clue and enter the <strong>secret code printed on it</strong> to unlock the next location.</p><input id="code" placeholder="Enter secret code" autocomplete="off" autocapitalize="characters" maxlength="12" aria-label="Secret code"><button onclick="checkCode()">Unlock next clue 🔐</button><p id="feedback" aria-live="polite"></p>`;document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')checkCode()});return}
if(k===stops.length){app.innerHTML=`<h1>FINAL TREASURE 🎁</h1><p>CHOTUUUU YOU DID ITTT 😭❤️</p><div class="note"><strong>YOUR FINAL DESTINATION</strong><br>Not on a shelf and not in view,<br>inside a drawer waits something for you. 💝</div><p class="small">Open the drawer gently and find your surprise.</p><button onclick="next()">I FOUND ITTT!!! 💗</button>`;return}
progress(100);app.innerHTML=`<div class="confetti">🍓❤️🎉</div><h1>Happy one month, my Chotu!</h1><p>BABYYYY YOU FOUND ITTTT 😭❤️</p><p>I got you these earrings because I wanted to give my prettiest girl one more reason to smile. Every little adventure with you is my favourite. These are just a tiny reminder that your boifiend is always thinking of you.</p><div class="note">13.10.2026 — the beginning of us. Here's to so many more memories, my gifiend. 💌</div><p><strong>I LOVE YOUUUUU, CHOTUUUU! MWAHHH 💋</strong></p><button onclick="stage=-1;showIntro()">Play again ♡</button>`}
function checkCode(){let k=stage-steps.length,s=stops[k],v=document.getElementById('code').value.trim().toUpperCase().replace(/\s/g,'');if(v===s.code){app.innerHTML=`<h1>UNLOCKED! 🔓💗</h1><p>THAT'S MY CLEVER CHOTUUUU 😭</p><div class="note">Your next destination: <strong>${s.next}</strong></div><button onclick="next()">Continue the hunt 🍓</button>`}else{document.getElementById('feedback').textContent='Not quite, babyyyy! Look at the code on the paper note 💗'}}
function answer(i){const s=steps[stage];if(i===s.correct){app.innerHTML=`<h1>THAT'S MY GIRLLLL! 💗</h1><p>${s.after}</p><button onclick="next()">Next memory →</button>`}else{wrong++;document.getElementById('feedback').textContent=wrong>1?'BABYYYY 😭 try another answer!':'CHOTUUUU HOW DID YOU FORGET 😭 try againnn!'}}showIntro();</script></html>
